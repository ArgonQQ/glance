name: Release

on:
  push:
    branches: [main]
    # Only what ships with the plugin cuts a release; docs and assets wait for the next one.
    paths:
      - 'hooks/**'
      - 'types/**'
      - '.claude-plugin/**'
      - 'LICENSE'
      - '.releaserc.json'
      - '.github/workflows/release.yml'

jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install -g @anthropic-ai/claude-code
      - run: claude plugin validate .
      - run: claude plugin test .

      - name: Semantic release
        id: release
        uses: cycjimmy/semantic-release-action@v5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Claude Code offers an update only when plugin.json's version changes, so the manifest
      # follows the tag. A re-run of an old SHA finds the version already set and commits nothing.
      - name: Sync plugin.json version
        if: steps.release.outputs.new_release_published == 'true'
        env:
          VERSION: ${{ steps.release.outputs.new_release_version }}
        run: |
          jq --arg v "$VERSION" '.version = $v' .claude-plugin/plugin.json > plugin.json.tmp
          mv plugin.json.tmp .claude-plugin/plugin.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .claude-plugin/plugin.json
          if git diff --quiet --cached; then exit 0; fi
          git commit -m "chore(release): v$VERSION [skip ci]"
          git push origin HEAD:main
